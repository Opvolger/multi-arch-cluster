---
# strategy free: every host runs its tasks on its own pace (no waiting on the slowest node per task)
- name: Update packages
  hosts: k0s
  become: true
  strategy: free
  tasks:
    - name: Install and upgrade packages
      ansible.builtin.include_tasks: tasks/k0s_install_stuff.yaml

    - name: Install latest kernel for riscv64
      when: "'riscv64' in group_names"
      block:

        - name: Create debian-backports.sources
          ansible.builtin.copy:
            content: |
              Types: deb deb-src
              URIs: http://deb.debian.org/debian
              Suites: trixie-backports
              Components: main
            dest: "/etc/apt/sources.list.d/debian-backports.sources"
            owner: root
            group: root
            mode: '0644'

        - name: Install latest backports kernel
          ansible.builtin.apt:
            name:
              - linux-image-riscv64
              - linux-headers-riscv64
            state: present
            default_release: trixie-backports
            update_cache: true

        - name: Get latest installed kernel
          ansible.builtin.shell: ls /lib/modules/ -rt | tail -n 1
          register: last_version_command

        - name: Set last_kernel_version
          ansible.builtin.set_fact:
            last_kernel_version: "{{ last_version_command.stdout }}"

        - name: Create new boot.cmd
          ansible.builtin.template:
            src: templates/boot.cmd
            dest: "/boot.cmd"
            owner: root
            group: root
            mode: '0644'

        - name: Update boot.scr for u-boot
          ansible.builtin.shell: sudo mkimage -C none -A riscv -T script -d /boot.cmd /boot.scr
          changed_when: true

    # reboot every node as soon as its own updates are done (strategy free)
    - name: Reboot
      ansible.builtin.reboot:
