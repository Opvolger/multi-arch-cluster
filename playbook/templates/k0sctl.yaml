apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: k0s-cluster
  user: admin
spec:
  hosts:
{% for host in groups["k0s"] %}
  - ssh:
      address: {{ hostvars[host].ansible_host }}
      user: {{ ansible_user }}
    role: {{ hostvars[host].k8s.role }}
    k0sBinaryPath: {{ hostvars[host].k0s_binary_path }}
{% if hostvars[host].k8s.noTaints is defined %}
    noTaints: {{ hostvars[host].k8s.noTaints }}
{% endif %}
{% if hostvars[host].k8s.environment is defined %}
    environment:
{% for key, value in hostvars[host].k8s.environment.items() %}
      {{ key }}: {{ value }}
{% endfor %}
{% endif %}
{% endfor %}
  k0s:
{% if k0s_version is defined %}
    # needed when k0sBinaryPath is newer than the latest stable release (no downgrade)
    version: {{ k0s_version }}
{% endif %}
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: Cluster
      metadata:
        name: k0s
      spec:
        # images:
        #   calico:
        #     cni:
        #       image: quay.io/k0sproject/calico-cni
        #       version: v3.29.7-1
        #     node:
        #       image: quay.io/k0sproject/calico-node
        #       version: v3.29.7-1
        #     kubecontrollers:
        #       image: quay.io/k0sproject/calico-kube-controllers
        #       version: v3.29.7-1
        api:
          externalAddress: 192.168.8.1
          k0sApiPort: 9443
          port: 6443
        installConfig:
          users:
            etcdUser: etcd
            kineUser: kube-apiserver
            konnectivityUser: konnectivity-server
            kubeAPIserverUser: kube-apiserver
            kubeSchedulerUser: kube-scheduler
        konnectivity:
          adminPort: 8133
          agentPort: 8132
        network:
          calico:
            mode: vxlan
          kubeProxy:
            disabled: false
            mode: iptables
          ipvs:
            strictARP: true
          kuberouter:
            autoMTU: true
            mtu: 0
            peerRouterASNs: ""
            peerRouterIPs: ""
          podCIDR: 10.244.0.0/16
          provider: kuberouter
          serviceCIDR: 10.96.0.0/12
        podSecurityPolicy:
          defaultPolicy: 00-k0s-privileged
        storage:
          type: etcd
        telemetry:
          enabled: true
  options:
    wait:
      enabled: false # raspberry pi 3 is slow! timeout
    drain:
      enabled: false
      gracePeriod: 5m0s
      timeout: 10m0s
      force: true
      ignoreDaemonSets: true
      deleteEmptyDirData: true
      podSelector: ""
      skipWaitForDeleteTimeout: 0s
    concurrency:
      limit: 30
      workerDisruptionPercent: 10
      uploads: 5
    evictTaint:
      enabled: false
      taint: k0sctl.k0sproject.io/evict=true
      effect: NoExecute
      controllerWorkers: false
