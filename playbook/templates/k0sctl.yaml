apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: k0s-cluster
  user: admin
spec:
  hosts:
{% for host in groups["k0s"] %}
  - ssh:
      address: {{ hostvars[host].ansible_host }}
      user: opvolger
    role: {{ hostvars[host].k8s.role }}
    k0sBinaryPath: {{ hostvars[host].k8s.k0sBinaryPath }}
{% if hostvars[host].k8s.noTaints is defined %}
    noTaints: {{ hostvars[host].k8s.noTaints }}
{% endif %}
{% if hostvars[host].k8s.environment is defined %}
    environment:
{% for key, value in hostvars[host].k8s.environment.items() %}
      {{ key }}: {{ value }}
{% endfor %}
{% endif %}
{% endfor %}
  k0s:
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: Cluster
      metadata:
        name: k0s
      spec:
        # images:
        #   calico:
        #     cni:
        #       image: quay.io/k0sproject/calico-cni
        #       version: v3.29.7-1
        #     node:
        #       image: quay.io/k0sproject/calico-node
        #       version: v3.29.7-1
        #     kubecontrollers:
        #       image: quay.io/k0sproject/calico-kube-controllers
        #       version: v3.29.7-1
        api:
          externalAddress: 192.168.8.1
          k0sApiPort: 9443
          port: 6443
        installConfig:
          users:
            etcdUser: etcd
            kineUser: kube-apiserver
            konnectivityUser: konnectivity-server
            kubeAPIserverUser: kube-apiserver
            kubeSchedulerUser: kube-scheduler
        extensions:
          helm:
            repositories:
            - name: prometheus-community
              url: https://prometheus-community.github.io/helm-charts
            - name: traefik
              url: https://traefik.github.io/charts
            - name: metallb
              url: https://metallb.github.io/metallb
            - name: csi-driver-smb
              url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-smb/master/charts
            - name: csi-driver-nfs
              url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
            charts:
            - name: kube-prometheus-stack-v2
              namespace: monitoring
              chartname: prometheus-community/kube-prometheus-stack
              version: "85.2.0" # Use the latest stable version
              values: |
                grafana:
                  ingress:
                    enabled: true
                    ingressClassName: traefik
                    hosts:
                      - grafana.k8s.opvolger.eu
                    annotations:
                      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
                prometheus-node-exporter:
                  image:
                    # riscv64 images not supported on quay.io, use docker.io/prom
                    registry: docker.io
                    repository: prom/node-exporter
                crds:
                  upgradeJob:
                    # image is there for amd64 and arm64, not riscv64 (yet)
                    affinity:
                      nodeAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          nodeSelectorTerms:
                            - matchExpressions:
                                - key: kubernetes.io/arch
                                  operator: In
                                  values:
                                    - amd64
                                    - arm64
                alertmanager:
                  alertmanagerSpec:
                    # image is there for amd64 and arm64, not riscv64 (yet)
                    affinity:
                      nodeAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          nodeSelectorTerms:
                            - matchExpressions:
                                - key: kubernetes.io/arch
                                  operator: In
                                  values:
                                    - amd64
                                    - arm64
                prometheusOperator:
                  # image is there for amd64 and arm64, not riscv64 (yet)
                  affinity:
                    nodeAffinity:
                      requiredDuringSchedulingIgnoredDuringExecution:
                        nodeSelectorTerms:
                          - matchExpressions:
                              - key: kubernetes.io/arch
                                operator: In
                                values:
                                  - amd64
                                  - arm64
                  admissionWebhooks:
                    deployment:
                      # image is there for amd64 and arm64, not riscv64 (yet)
                      affinity:
                        nodeAffinity:
                          requiredDuringSchedulingIgnoredDuringExecution:
                            nodeSelectorTerms:
                              - matchExpressions:
                                  - key: kubernetes.io/arch
                                    operator: In
                                    values:
                                      - amd64
                                      - arm64
                    patch:
                      # image is there for amd64 and arm64, not riscv64 (yet)
                      affinity:
                        nodeAffinity:
                          requiredDuringSchedulingIgnoredDuringExecution:
                            nodeSelectorTerms:
                              - matchExpressions:
                                  - key: kubernetes.io/arch
                                    operator: In
                                    values:
                                      - amd64
                                      - arm64
                prometheus:
                  prometheusSpec:
                    # image is there for amd64 and arm64, not riscv64 (yet)
                    affinity:
                      nodeAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          nodeSelectorTerms:
                            - matchExpressions:
                                - key: kubernetes.io/arch
                                  operator: In
                                  values:
                                    - amd64
                                    - arm64
                thanosRuler:
                  thanosRulerSpec:
                    # image is there for amd64 and arm64, not riscv64 (yet)
                    affinity:
                      nodeAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          nodeSelectorTerms:
                            - matchExpressions:
                                - key: kubernetes.io/arch
                                  operator: In
                                  values:
                                    - amd64
                                    - arm64
                kubeEtcd:
                  endpoints:
{% for host in groups["k0s"] %}
{% if hostvars[host].k8s.noTaints is defined %}
                    - {{ hostvars[host].ansible_host }}
{% endif %}
{% endfor %}
                kubeControllerManager:
                  endpoints:
{% for host in groups["k0s"] %}
{% if hostvars[host].k8s.noTaints is defined %}
                    - {{ hostvars[host].ansible_host }}
{% endif %}
{% endfor %}
                kubeScheduler:
                  endpoints:
{% for host in groups["k0s"] %}
{% if hostvars[host].k8s.noTaints is defined %}
                    - {{ hostvars[host].ansible_host }}
{% endif %}
{% endfor %}
            # docker buildx build --platform linux/amd64,linux/arm64,linux/riscv64 --tag opvolger/metallb-controller:v0.15.3  --push --file controller/Dockerfile .
            # docker buildx build --platform linux/amd64,linux/arm64,linux/riscv64 --tag opvolger/metallb-speaker:v0.15.3  --push --file speaker/Dockerfile .
            # helm install metallb metallb/metallb --values templates/metallb.yaml -n metallb-system
            # helm uninstall metallb -n metallb-system
            # kubectl apply -f ip-pool.yaml -n metallb-system
            # https://oneuptime.com/blog/post/2026-02-09-kube-proxy-strict-arp-metallb/view
            - name: metallb
              chartname: metallb/metallb
              version: 0.15.3
              namespace: metallb-system
              values: |
                controller:
                  image:
                    # pullPolicy: Always
                    repository: opvolger/metallb-controller
                    tag: v0.15.3
                speaker:
                  frr:
                    enabled: false # no riscv64 (build)
                  image:
                    # pullPolicy: Always
                    repository: opvolger/metallb-speaker
                    tag: v0.15.3
            # https://oneuptime.com/blog/post/2026-01-07-metallb-traefik-ingress/view
            - name: traefik
              chartname: traefik/traefik
              version: 39.0.7
              namespace: traefik-system
              values: |
                service:
                  enabled: true
                  annotations:
                    # Request a specific IP from MetalLB's pool
                    metallb.universe.tf/loadBalancerIPs: "192.168.8.50"
            - name: csi-driver-smb
              version: 1.20.0
              namespace: kube-system
              chartname: csi-driver-smb/csi-driver-smb
              values: |
                image:
                  baseRepo: opvolger
                  smb:
                    repository: /smbplugin # done
                    tag: v1.20.0
                    pullPolicy: IfNotPresent
                  csiProvisioner:
                    repository: /csi-provisioner # done
                    tag: 6.1-canary
                    pullPolicy: IfNotPresent
                  csiResizer:
                    repository: /csi-resizer # done
                    tag: 2.0-canary
                    pullPolicy: IfNotPresent
                  livenessProbe:
                    repository: /livenessprobe # done
                    tag: 2.17-canary
                    pullPolicy: IfNotPresent
                  nodeDriverRegistrar:
                    repository: /csi-node-driver-registrar  # done
                    tag: 2.15-canary
                    pullPolicy: IfNotPresent
                  csiproxy:
                    repository: ghcr.io/kubernetes-sigs/sig-windows/csi-proxy  # not needed only windows
                    tag: v1.1.2
                    pullPolicy: IfNotPresent
                # for k0s change the kubelet path
                linux:
                    kubelet: /var/lib/k0s/kubelet
                windows:
                    kubelet: 'C:\\var\\lib\\k0s\\kubelet'
            - name: csi-driver-nfs
              version: 4.13.2
              namespace: kube-system
              chartname: csi-driver-nfs/csi-driver-nfs
              values: |
                image:
                    baseRepo: opvolger
                    nfs:
                        repository: /nfsplugin
                        tag: v4.13.2
                        pullPolicy: IfNotPresent
                    csiProvisioner:
                        repository: /csi-provisioner
                        tag: 6.1-canary
                        pullPolicy: IfNotPresent
                    csiResizer:
                        repository: /csi-resizer
                        tag: 2.0-canary
                        pullPolicy: IfNotPresent
                    csiSnapshotter:
                        repository: /csi-snapshotter
                        tag: 8.5-canary
                        pullPolicy: IfNotPresent
                    livenessProbe:
                        repository: /livenessprobe
                        tag: 2.17-canary
                        pullPolicy: IfNotPresent
                    nodeDriverRegistrar:
                        repository: /csi-node-driver-registrar
                        tag: 2.15-canary
                        pullPolicy: IfNotPresent
                    externalSnapshotter:
                        repository: /snapshot-controller
                        tag: 8.5-canary
                        pullPolicy: IfNotPresent
                # for k0s change the kubelet path
                kubeletDir: /var/lib/k0s/kubelet
            concurrencyLevel: 5
        konnectivity:
          adminPort: 8133
          agentPort: 8132
        network:
          calico:
            mode: vxlan
          kubeProxy:
            disabled: false
            mode: iptables
          ipvs:
            strictARP: true
          kuberouter:
            autoMTU: true
            mtu: 0
            peerRouterASNs: ""
            peerRouterIPs: ""
          podCIDR: 10.244.0.0/16
          provider: kuberouter
          serviceCIDR: 10.96.0.0/12
        podSecurityPolicy:
          defaultPolicy: 00-k0s-privileged
        storage:
          type: etcd
        telemetry:
          enabled: true
  options:
    wait:
      enabled: false # raspberry pi 3 is slow! timeout
    drain:
      enabled: true
      gracePeriod: 2m0s
      timeout: 5m0s
      force: true
      ignoreDaemonSets: true
      deleteEmptyDirData: true
      podSelector: ""
      skipWaitForDeleteTimeout: 0s
    concurrency:
      limit: 30
      workerDisruptionPercent: 10
      uploads: 5
    evictTaint:
      enabled: false
      taint: k0sctl.k0sproject.io/evict=true
      effect: NoExecute
      controllerWorkers: false
