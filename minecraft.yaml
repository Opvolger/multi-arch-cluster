apiVersion: apps/v1
kind: Deployment
metadata:
  name: basm-minecraft
  namespace: games
  labels:
    app.kubernetes.io/instance: basm-minecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: basm-minecraft
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: basm-minecraft
    spec:
      volumes:
      - name: persistentvolume
        persistentVolumeClaim:
          claimName: basm-minecraft
      containers:
      - name: basm-minecraft
        image: opvolger/minecraft-server:latest
        stdin: true    # <--- Enables standard input
        tty: true      # <--- Enables TTY allocation
        env:
          - name: EULA
            value: "TRUE"
        ports:
        - name: minecraft
          containerPort: 25565
          protocol: TCP
        resources:
          requests:
            memory: "3500Mi"
            cpu: "400m"
          limits:
            memory: "5000Mi"
            cpu: "3500m"
        volumeMounts:
        - name: persistentvolume
          mountPath: /data
        imagePullPolicy: IfNotPresent
      restartPolicy: Always
      # nodeSelector:
      #   kubernetes.io/arch: riscv64
      # # image is there for amd64 and arm64, not riscv64 (yet)
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #             - key: kubernetes.io/arch
      #               operator: In
      #               values:
      #                 - amd64
      #                 - arm64
---
apiVersion: v1
kind: Service
metadata:
  name: basm-minecraft
  namespace: games
  labels:
    app.kubernetes.io/instance: basm-minecraft
status:
  loadBalancer:
    ingress:
    - ip: 192.168.8.52
      ipMode: VIP
spec:
  ports:
  - name: minecraft
    protocol: TCP
    port: 25565
    targetPort: minecraft
    nodePort: 32543
  selector:
    app.kubernetes.io/instance: basm-minecraft
  type: LoadBalancer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: basm-minecraft
  namespace: games
  labels:
    app.kubernetes.io/instance: basm-minecraft
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  # comment this line the first time, set `persistentVolumeReclaimPolicy` of the `PersistentVolume` from `Delete` to `Retain` and change volumeName to correct one
  volumeName: pvc-76e119e5-2a84-4c9d-8e5c-a8ac345673e2
  # if PersistentVolumeClaim is deleted, delete `claimRef` in PersistentVolume and recreate the PersistentVolumeClaim
  storageClassName: smb
  volumeMode: Filesystem
