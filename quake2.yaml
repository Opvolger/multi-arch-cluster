apiVersion: apps/v1
kind: Deployment
metadata:
  name: basm-quake2
  namespace: default
  labels:
    app.kubernetes.io/instance: basm-quake2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: basm-quake2
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: basm-quake2
    spec:
      volumes:
      - name: persistentvolume
        persistentVolumeClaim:
          claimName: basm-quake2
      containers:
      - name: basm-quake2
        image: opvolger/quake2
        stdin: true    # <--- Enables standard input
        tty: true      # <--- Enables TTY allocation
        ports:
        - name: quake2
          containerPort: 27910
          protocol: UDP
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        volumeMounts:
        - name: persistentvolume
          mountPath: /yquake2/.yq2
        imagePullPolicy: IfNotPresent
      restartPolicy: Always
      # # image is there for riscv64/amd64 and arm64
      # nodeSelector:
      #   kubernetes.io/arch: riscv64
      #   # kubernetes.io/arch: amd64
      #   # kubernetes.io/arch: arm64
---
apiVersion: v1
kind: Service
metadata:
  name: basm-quake2
  namespace: default
  labels:
    app.kubernetes.io/instance: basm-quake2
status:
  loadBalancer:
    ingress:
    - ip: 192.168.8.51
      ipMode: VIP
spec:
  ports:
  - name: quake2
    protocol: UDP
    port: 27910
    targetPort: quake2
    nodePort: 32542
  selector:
    app.kubernetes.io/instance: basm-quake2
  type: LoadBalancer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: basm-quake2
  namespace: default
  labels:
    app.kubernetes.io/instance: basm-quake2
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  # comment this line the first time, set `persistentVolumeReclaimPolicy` of the `PersistentVolume` from `Delete` to `Retain` and change volumeName to correct one
  volumeName: pvc-fbf382e8-7be4-4663-adca-e93c592fc317
  # if PersistentVolumeClaim is deleted, delete `claimRef` in PersistentVolume and recreate the PersistentVolumeClaim
  storageClassName: smb
  volumeMode: Filesystem
